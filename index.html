<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Abril</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff1f5, #fce4ec);
      font-family: "Poppins", sans-serif;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    main {
      max-width: 42rem;
    }

    h1 {
      padding: 1rem;
      color: #ad1457;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      margin: 0 0 1.5rem;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.9rem 2rem;
      background: #d81b60;
      color: #fff;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0.4rem 1rem #ad145744;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    button:hover {
      background: #ad1457;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #880e4f;
      outline-offset: 4px;
    }

    #boton-amor {
      margin-top: 0.5rem;
    }

    #pantalla-amor {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 1.5rem;
      border: 0;
      box-sizing: border-box;
      background: linear-gradient(135deg, #fff1f5, #fce4ec);
      color: #ad1457;
      place-items: center;
    }

    #pantalla-amor:not([open]) {
      display: none;
    }

    #pantalla-amor[open] {
      display: grid;
    }

    #pantalla-amor::backdrop {
      background: #880e4f;
    }

    #pantalla-amor h2 {
      margin: 0 0 1.5rem;
      font-size: clamp(3rem, 12vw, 7rem);
    }

    #abrazo {
      min-height: 0;
      margin: 0;
      color: #880e4f;
      font-size: 1.2rem;
      font-weight: 600;
    }

    #abrazo.visible {
      animation: aparecer 500ms ease both;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hola Abril te quiero mucho</h1>
    <button id="boton-abrazo" type="button">Te quiero</button>
    <p id="abrazo" aria-live="polite"></p>
    <button id="boton-amor" type="button">¿Quién es el amor de Abril?</button>
  </main>
  <dialog id="pantalla-amor" aria-labelledby="titulo-seungmin">
    <div>
      <h2 id="titulo-seungmin">Seungmin</h2>
      <button id="cerrar-pantalla" type="button">Volver</button>
    </div>
  </dialog>
  <script>
    const boton = document.querySelector("#boton-abrazo");
    const mensajeAbrazo = document.querySelector("#abrazo");
    const botonAmor = document.querySelector("#boton-amor");
    const pantallaAmor = document.querySelector("#pantalla-amor");
    const botonCerrarPantalla = document.querySelector("#cerrar-pantalla");

    boton.addEventListener("click", () => {
      mensajeAbrazo.textContent = "¡Te mando un abrazo enorme! 🤗";
      mensajeAbrazo.classList.remove("visible");
      void mensajeAbrazo.offsetWidth;
      mensajeAbrazo.classList.add("visible");
    });

    botonAmor.addEventListener("click", () => {
      pantallaAmor.showModal();
    });

    botonCerrarPantalla.addEventListener("click", () => {
      pantallaAmor.close();
    });
  </script>
</body>
</html>
